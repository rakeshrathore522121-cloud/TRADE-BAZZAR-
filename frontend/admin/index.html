<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADE BAZZAR Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<div id="loginView" class="admin-login"><div class="admin-card login-card"><div class="brand">TB</div><h1>TRADE BAZZAR</h1><p>ADMIN PANEL</p><form id="adminLogin"><input id="aid" placeholder="Admin ID" value="admin"><input id="apw" type="password" placeholder="Password" value="Admin@123"><button>SIGN IN</button></form><div id="am"></div></div></div>
<div id="panelView" class="hidden"><header class="admin-top"><b>TRADE BAZZAR / ADMIN</b><button id="alogout">Logout</button></header><main class="admin-main">
<div class="stats" id="stats"></div>
<section class="admin-card"><div class="head"><h2>Create User</h2></div><div class="grid"><input id="newUid" placeholder="User ID"><input id="newPw" placeholder="Password"><input id="newName" placeholder="Name"><input id="newMobile" placeholder="Mobile"><input id="newEmail" placeholder="Email"><input id="newPan" placeholder="PAN"><input id="newAadhaar" placeholder="Aadhaar"><input id="newDob" type="date"><button id="createUser">CREATE USER</button></div></section>
<section class="admin-card"><div class="head"><h2>Users / Profile / Balance</h2><button id="loadUsers">Refresh</button></div><div class="table-wrap"><table id="usersTable"></table></div></section>
<section class="admin-card"><div class="head"><h2>Deposit Requests</h2><button id="loadDeps">Refresh</button></div><div class="table-wrap"><table id="depsTable"></table></div></section>
<section class="admin-card"><div class="head"><h2>Withdrawal Requests</h2><button id="loadWds">Refresh</button></div><div class="table-wrap"><table id="wdsTable"></table></div></section>
<section class="admin-card"><div class="head"><h2>Orders</h2><button id="loadOrders">Refresh</button></div><div class="table-wrap"><table id="ordersTable"></table></div></section>
<section class="admin-card"><div class="head"><h2>Open Positions</h2><button id="loadPositions">Refresh</button></div><div class="table-wrap"><table id="positionsTable"></table></div></section>
<section class="admin-card"><h2>Deposit UPI / QR Settings</h2><p class="hint">Yahan se user side ka UPI ID aur QR change hoga.</p><div class="grid"><input id="upiId" placeholder="UPI ID"><button id="saveUpi">SAVE UPI</button></div><div class="qr-admin"><img id="qrPreview" alt="QR Preview"><div class="grid"><input id="qrFile" type="file" accept="image/png,image/jpeg,image/webp"><button id="uploadQr">UPLOAD / CHANGE QR</button><button id="removeQr" class="danger-btn">REMOVE QR</button></div></div></section>
<section class="admin-card"><h2>News / Ticker</h2><div class="grid"><input id="headline" placeholder="News headline"><button id="addNews">ADD NEWS</button></div><div id="newsAdmin"></div></section>
<section class="admin-card"><h2>Reports</h2><a class="download" href="/api/admin/reports/orders.csv">Download Orders CSV</a></section>
</main></div><script src="/admin/admin.js"></script></body></html>
